services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  
  redis:
    image: redis:7
  
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ascend
      POSTGRES_USER: ascend_user
      POSTGRES_PASSWORD: ascend_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend_user -d ascend"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ascend.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"


volumes:
  postgres_data: